<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css">

  </head>
  <body>
    <div class="navbar">
      <h1>Password <span>generator</span></h1>
      <div class="icon">
        <i class="fa-solid fa-sun" id="sun"></i>
        <i class="fa-solid fa-moon" id="moon"></i>
      </div>
    </div>
    <div class="main">
      <div class="main-containt">
        <div class="password-box">
          <input type="text" id="password" value="" readonly />

          <button id="copyBtn">
            <i class="fa-regular fa-copy"></i>
            Copy
          </button>
        </div>
        <div class="length-control">
          <label for="length">Password Length</label>

          <div class="length-value">
            <input type="range" id="length" min="4" max="32" value="12" />
            <span id="lengthValue">12</span>
          </div>
        </div>
        <div class="check-box">
          <label>
            <input type="checkbox" id="uppercase" checked>
            Uppercase(A-Z)
          </label>
          <label>
            <input type="checkbox" id="lowercase" checked>
            Lowercase(a-z)
          </label>
          <label>
            <input type="checkbox" id="numbers" checked>
            Numbers(0-9)
          </label>
          <label>
            <input type="checkbox" id="symbols" checked>
            Symbols(@!#$)
          </label>
        </div>
        <button id="generatePasswordBtn">Generate Password</button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
